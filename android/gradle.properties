# Reduced from -Xmx8G/-XX:MaxMetaspaceSize=4G: the 8GB heap + 4GB metaspace
# reservation could not be committed on this 24GB host (no usable pagefile),
# which crashed the daemon and corrupted the Gradle transform cache.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=4
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
# Must stay false: several plugins (e.g. image_picker_android) declare a
# `kotlin { }` block but rely on Flutter applying kotlin-android to them.
android.builtInKotlin=false
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=false
