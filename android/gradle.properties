# Sized to the machine: -Xmx8G/-XX:MaxMetaspaceSize=4G could not be committed
# (free virtual memory ~5.5G, no pagefile) and crashed the Gradle daemon, which
# corrupted the transform cache. Raise these only if you free up RAM.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Must stay false. image_picker_android (and others) declare a `kotlin { }` block
# but rely on Flutter applying kotlin-android to them. With this set to true,
# :image_picker_android fails with "Unresolved reference 'kotlin'" / "'android'".
android.builtInKotlin=false
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=false
