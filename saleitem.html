    body {
      background-color: #090A0F;

    /* Ultra-fine dot grid background */
    .bg-dot-matrix {
      background-image: radial-gradient(rgba(255, 255, 255, 0.065) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Glassmorphic layered surfaces with cursor spotlight */
    .spotlight-card {
      position: relative;
      background: linear-gradient(180deg, rgba(17, 19, 29, 0.78) 0%, rgba(12, 14, 22, 0.90) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.24s ease, box-shadow 0.24s ease, opacity 0.25s ease;
    }

    .spotlight-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: radial-gradient(
        480px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(139, 92, 246, 0.42),
        transparent 45%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.28s ease;
    }

    .spotlight-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        440px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(124, 58, 237, 0.085),
        transparent 60%
      );
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.28s ease;
    }

    .spotlight-card:hover::before,
    .spotlight-card:hover::after {
      opacity: 1;
    }

    .spotlight-card:hover {
      transform: translateY(-2px);
      border-color: rgba(139, 92, 246, 0.28);
      box-shadow: 0 18px 40px -15px rgba(0, 0, 0, 0.65);
    }

    /* Active purple gradient pill with specular top highlight */
    .active-tab-pill {
      background: linear-gradient(180deg, #7C3AED 0%, #6D28D9 100%);
      box-shadow:
        inset 0 1px 0 0 rgba(255, 255, 255, 0.28),
        0 8px 20px -6px rgba(124, 58, 237, 0.6);
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Sleek custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(13, 15, 23, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.24);
    }
  </style>

          <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>
        </svg>`;
      }
      // Default cup/straw icon matching the screenshot's left icon badge
      return `<svg class="w-5 h-5 ${colorClass}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M6 8h11v9a4 4 0 0 1-4 4h-3a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="10" y2="8"/><line x1="6" y1="12" x2="17" y2="12"/>
      </svg>`;
    }

    function formatMMK(num) {
      return `MMK ${num.toLocaleString('en-US')}`;
    }

    // --- Update Live Counters & KPI Cards ---
    function updateCountersAndKPIs() {
      const totalCount = transactions.length;
      const soldItems = transactions.filter(t => t.status === 'sold');
      const orderItems = transactions.filter(t => t.status === 'order');

      const totalRevenue = transactions.reduce((acc, t) => acc + t.amount, 0);

      document.getElementById('tab-all').textContent = `All (${totalCount})`;
      document.getElementById('tab-sold').textContent = `Sold (${soldItems.length})`;
      document.getElementById('tab-order').textContent = `Order (${orderItems.length})`;

      document.getElementById('headerTotalBadge').textContent = `${totalCount} Total Record${totalCount === 1 ? '' : 's'}`;
      document.getElementById('kpiRevenue').textContent = formatMMK(totalRevenue);
      document.getElementById('kpiSoldCount').textContent = soldItems.length;
      document.getElementById('kpiOrderCount').textContent = orderItems.length;
    }

    // --- Filter & Render Transaction Cards ---
    function renderTransactions() {
      updateCountersAndKPIs();

      let filtered = [...transactions];

      // 1. Tab filter
      if (activeTab === 'sold') {
        filtered = filtered.filter(t => t.status === 'sold');
      } else if (activeTab === 'order') {
        filtered = filtered.filter(t => t.status === 'order');
      }

      // 2. Dropdown timeframe / sort filter
      if (activeDropdownFilter === 'today') {
        filtered = filtered.filter(t => t.dateBucket === 'today');
      } else if (activeDropdownFilter === '7days') {
        filtered = filtered.filter(t => t.dateBucket === 'today' || t.dateBucket === '7days');
      } else if (activeDropdownFilter === 'month') {
        filtered = filtered.filter(t => ['today', '7days', 'month'].includes(t.dateBucket));
      } else if (activeDropdownFilter === 'highest') {
        filtered.sort((a, b) => b.amount - a.amount);
      }

      // 3. Live Search filter
      if (searchQuery.trim() !== '') {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(t =>
          t.id.toLowerCase().includes(q) ||
          t.item.toLowerCase().includes(q) ||
          t.staff.toLowerCase().includes(q) ||
          t.customerType.toLowerCase().includes(q)
        );
      }

      const container = document.getElementById('transactionsList');

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="rounded-2xl bg-obsidian-850/70 border border-white/[0.08] py-14 px-6 text-center space-y-3">
            <div class="w-11 h-11 mx-auto rounded-2xl bg-white/[0.04] border border-white/10 flex items-center justify-center text-slate-400">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </div>
            <p class="font-display text-sm font-semibold text-white">No matching transactions found</p>
            <p class="text-xs text-slate-400 max-w-sm mx-auto">Try clearing your search filter or switching between All, Sold, and Order tabs.</p>
            <button type="button" onclick="resetFilters()" class="mt-1 px-4 py-2 rounded-xl bg-violet-600/20 hover:bg-violet-600/30 border border-violet-500/30 text-xs font-medium text-violet-200 transition">
              Reset Filters
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map((tx) => {
        const isSold = tx.status === 'sold';
        const statusBadge = isSold
          ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 shadow-[0_0_15px_-3px_rgba(16,185,129,0.35)]">
               <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_6px_#34d399]"></span>
               Already Sale
             </span>`
          : `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-amber-500/15 text-amber-300 border border-amber-500/30 shadow-[0_0_15px_-3px_rgba(245,158,11,0.3)]">
               <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
               Order
             </span>`;

        const iconBoxGradient = isSold
          ? 'from-violet-500/15 via-slate-800/40 to-obsidian-900 border-violet-400/25'
          : 'from-amber-500/15 via-slate-800/40 to-obsidian-900 border-amber-400/25';

        return `
          <article 
            onclick="openReceiptDrawer('${tx.id}')"
            class="spotlight-card group cursor-pointer rounded-2xl border border-white/[0.08] p-4 sm:px-5 sm:py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4"
            role="button"
            tabindex="0"
            aria-label="Invoice ${tx.id} for ${tx.item}"
          >
            <!-- Left & Primary Info Block -->
            <div class="flex items-start sm:items-center gap-3.5 sm:gap-4 min-w-0">
              <!-- Glass Icon Container -->
              <div class="w-12 h-12 rounded-xl bg-gradient-to-br ${iconBoxGradient} border flex items-center justify-center shrink-0 shadow-inner group-hover:scale-105 transition-transform">
                ${getItemIconSVG(tx.iconType, tx.status)}
              </div>

              <!-- Details Stack -->
              <div class="min-w-0 space-y-1">
                <!-- Invoice ID Pill with One-Click Copy -->
                <div class="flex items-center gap-2">
                  <button 
                    type="button" 
                    onclick="copyInvoiceId(event, '${tx.id}')" 
                    class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md bg-white/[0.04] hover:bg-violet-500/20 border border-white/[0.07] hover:border-violet-400/35 font-mono text-[11px] text-slate-400 hover:text-violet-200 tabular-nums transition"
                    title="Click to copy Invoice ID"
                  >
                    <span>${tx.id}</span>
                    <svg class="w-3 h-3 opacity-60 group-hover:opacity-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                  </button>
                </div>

                <!-- Product Title -->
                <h2 class="font-display text-base font-bold text-white group-hover:text-violet-200 transition-colors truncate">
                  ${tx.item}
                </h2>

                <!-- Inline Metadata: Customer badge • by Myat Noe Hla -->
                <div class="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-slate-400">
                  <span class="inline-flex items-center px-1.5 py-0.2 rounded bg-white/[0.05] border border-white/[0.07] text-[11px] font-medium text-slate-300">
                    ${tx.customerType}
                  </span>
                  <span class="text-slate-600">•</span>
                  <span class="italic text-slate-400">by ${tx.staff}</span>
                </div>

                <!-- Bottom Row: x1 Quantity Chip + Calendar Timestamp -->
                <div class="flex flex-wrap items-center gap-2.5 pt-0.5 text-xs text-slate-400">
                  <span class="px-1.5 py-0.5 rounded bg-violet-500/10 border border-violet-400/20 font-mono text-[11px] font-medium text-violet-300 tabular-nums">
                    x${tx.qty}
                  </span>
                  <span class="inline-flex items-center gap-1.5 font-mono text-[11px] text-slate-400 tabular-nums">
                    <svg class="w-3.5 h-3.5 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <span>${tx.timestamp}</span>
                  </span>
                </div>
              </div>
            </div>

            <!-- Right Financial & Action Column -->
            <div class="flex sm:flex-col items-center sm:items-end justify-between sm:justify-center gap-3 pt-3 sm:pt-0 border-t sm:border-t-0 border-white/[0.06] shrink-0">
              <!-- Top Right: Status Badge + Inspect Chevron + Delete Trash Action -->
              <div class="flex items-center gap-2 order-2 sm:order-1">
                ${statusBadge}
                <span class="hidden sm:inline-flex w-7 h-7 rounded-lg bg-white/[0.03] group-hover:bg-white/[0.08] border border-white/[0.06] items-center justify-center text-slate-400 group-hover:text-white transition" title="Inspect Receipt">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"/>
                  </svg>
                </span>
                <button 
                  type="button" 
                  onclick="deleteTransaction(event, '${tx.id}')" 
                  class="w-7 h-7 rounded-lg bg-rose-500/[0.06] hover:bg-rose-500/20 border border-rose-500/15 hover:border-rose-500/40 text-rose-400 hover:text-rose-300 flex items-center justify-center transition"
                  title="Delete Record"
                  aria-label="Delete ${tx.id}"
                >
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                  </svg>
                </button>
              </div>

              <!-- Prominent Tabular MMK Currency Value -->
              <div class="order-1 sm:order-2 font-mono text-base sm:text-lg font-semibold text-violet-300 group-hover:text-white tabular-nums tracking-tight transition-colors">
                ${formatMMK(tx.amount)}
              </div>
            </div>
          </article>
        `;
      }).join('');

      attachSpotlightListeners();
    }

    // --- Cursor-Tracking Radial Spotlight Glow ---
    function attachSpotlightListeners() {
      document.querySelectorAll('.spotlight-card').forEach(card => {
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
          card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
        });
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            card.click();
          }
        });
      });
    }

    // --- Tab Switching Logic ---
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('active-tab-pill', 'text-white', 'font-semibold');
          b.classList.add('text-slate-400', 'font-medium');
        });
        btn.classList.add('active-tab-pill', 'text-white', 'font-semibold');
        btn.classList.remove('text-slate-400', 'font-medium');
        renderTransactions();
      });
    });

    // --- Top-Right 'All v' Dropdown Logic ---
    const filterDropdownBtn = document.getElementById('filterDropdownBtn');
    const filterDropdownMenu = document.getElementById('filterDropdownMenu');
    const filterChevron = document.getElementById('filterChevron');

    filterDropdownBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = filterDropdownMenu.classList.contains('hidden');
      filterDropdownMenu.classList.toggle('hidden');
      filterChevron.classList.toggle('rotate-180', isHidden);
    });

    document.querySelectorAll('.filter-option').forEach(option => {
      option.addEventListener('click', () => {
        activeDropdownFilter = option.dataset.filter;
        document.getElementById('selectedFilterLabel').textContent = option.querySelector('span').textContent;

        document.querySelectorAll('.filter-option').forEach(opt => {
          opt.classList.remove('text-violet-300', 'bg-violet-500/10', 'font-medium');
          opt.classList.add('text-slate-300');
          const dot = opt.querySelector('span:nth-child(2)');
          if (dot) dot.remove();
        });

        option.classList.add('text-violet-300', 'bg-violet-500/10', 'font-medium');
        option.classList.remove('text-slate-300');
        option.insertAdjacentHTML('beforeend', '<span class="w-1.5 h-1.5 rounded-full bg-violet-400"></span>');

        filterDropdownMenu.classList.add('hidden');
        filterChevron.classList.remove('rotate-180');
        renderTransactions();
      });
    });

    document.addEventListener('click', (e) => {
      if (!document.getElementById('filterDropdownWrapper').contains(e.target)) {
        filterDropdownMenu.classList.add('hidden');
        filterChevron.classList.remove('rotate-180');
      }
    });

    // --- Live Search & '/' Keyboard Shortcut ---
    const searchInput = document.getElementById('searchInput');
    const mobileSearchInput = document.getElementById('mobileSearchInput');

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      mobileSearchInput.value = searchQuery;
      renderTransactions();
    });

    mobileSearchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      searchInput.value = searchQuery;
      renderTransactions();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput && document.activeElement !== mobileSearchInput) {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.key === 'Escape') {
        closeReceiptDrawer();
        filterDropdownMenu.classList.add('hidden');
        filterChevron.classList.remove('rotate-180');
      }
    });

    function resetFilters() {
      activeTab = 'all';
      activeDropdownFilter = 'all';
      searchQuery = '';
      searchInput.value = '';
      mobileSearchInput.value = '';
      document.getElementById('selectedFilterLabel').textContent = 'All';
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('active-tab-pill', 'text-white', 'font-semibold');
        b.classList.add('text-slate-400', 'font-medium');
      });
      const allTab = document.getElementById('tab-all');
      allTab.classList.add('active-tab-pill', 'text-white', 'font-semibold');
      allTab.classList.remove('text-slate-400', 'font-medium');
      renderTransactions();
    }

    // --- One-Click Copy Invoice ID (Using execCommand fallback for iFrames) ---
    function copyInvoiceId(event, invoiceId) {
      event.stopPropagation();
      const tempInput = document.createElement('textarea');
      tempInput.value = invoiceId;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand('copy');
        showToast(`Copied ${invoiceId}`, 'info');
      } catch (err) {
        showToast(`Invoice ID: ${invoiceId}`, 'info');
      }
      document.body.removeChild(tempInput);
    }

    // --- Delete Transaction with Undo Toast ---
    function deleteTransaction(event, invoiceId) {
      event.stopPropagation();
      const idx = transactions.findIndex(t => t.id === invoiceId);
      if (idx === -1) return;

      lastDeletedRecord = transactions[idx];
      lastDeletedIndex = idx;
      transactions.splice(idx, 1);

      renderTransactions();
      showUndoToast(`Deleted ${invoiceId}`);
    }

    function undoLastDelete() {
      if (!lastDeletedRecord) return;
      const insertAt = Math.min(Math.max(0, lastDeletedIndex), transactions.length);
      transactions.splice(insertAt, 0, lastDeletedRecord);
      const restoredId = lastDeletedRecord.id;
      lastDeletedRecord = null;
      lastDeletedIndex = -1;
      renderTransactions();
      showToast(`Restored ${restoredId}`, 'success');
    }

    // --- Digital Receipt Slide-Over Drawer ---
    const receiptBackdrop = document.getElementById('receiptBackdrop');
    const receiptDrawer = document.getElementById('receiptDrawer');

    function openReceiptDrawer(invoiceId) {
      const tx = transactions.find(t => t.id === invoiceId);
      if (!tx) return;

      const isSold = tx.status === 'sold';
      const unitPrice = Math.round(tx.amount / tx.qty);

      document.getElementById('receiptDrawerHeader').innerHTML = `
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-violet-500/15 border border-violet-400/30 flex items-center justify-center text-violet-300">
            ${getItemIconSVG(tx.iconType, tx.status)}
          </div>
          <div>
            <span class="font-mono text-[11px] text-slate-400">${tx.id}</span>
            <h3 class="font-display font-bold text-base text-white">Digital Receipt</h3>
          </div>
        </div>
        <button type="button" onclick="closeReceiptDrawer()" class="p-2 rounded-xl bg-white/[0.04] hover:bg-white/[0.1] text-slate-400 hover:text-white transition">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      `;

      document.getElementById('receiptDrawerBody').innerHTML = `
        <!-- Status Banner -->
        <div class="rounded-2xl p-4 border ${isSold ? 'bg-emerald-500/[0.07] border-emerald-500/25' : 'bg-amber-500/[0.07] border-amber-500/25'} flex items-center justify-between">
          <div>
            <span class="text-[11px] uppercase tracking-wider font-semibold ${isSold ? 'text-emerald-300' : 'text-amber-300'}">Transaction Status</span>
            <p class="text-sm font-semibold text-white mt-0.5">${isSold ? 'Already Sale (Settled)' : 'Pending Order'}</p>
          </div>
          <button 
            type="button" 
            onclick="toggleTransactionStatus('${tx.id}')" 
            class="px-3 py-1.5 rounded-xl text-xs font-semibold ${isSold ? 'bg-white/[0.06] hover:bg-white/[0.12] text-slate-200 border border-white/10' : 'bg-emerald-500 hover:bg-emerald-400 text-obsidian-950 shadow-lg shadow-emerald-500/20'} transition"
          >
            ${isSold ? 'Revert to Order' : 'Mark as Already Sale'}
          </button>
        </div>

        <!-- Line Item Breakdown -->
        <div class="rounded-2xl bg-white/[0.03] border border-white/[0.08] p-4 space-y-3.5">
          <div class="flex items-start justify-between gap-3 pb-3 border-b border-white/[0.07]">
            <div>
              <p class="text-xs text-slate-400">Item Name</p>
              <p class="font-display text-base font-bold text-white mt-0.5">${tx.item}</p>
            </div>
            <span class="px-2 py-0.5 rounded bg-violet-500/15 border border-violet-400/25 font-mono text-xs text-violet-200 tabular-nums">
              x${tx.qty}
            </span>
          </div>

          <div class="space-y-2 text-xs">
            <div class="flex justify-between">
              <span class="text-slate-400">Unit Price</span>
              <span class="font-mono text-slate-200 tabular-nums">${formatMMK(unitPrice)}</span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-400">Quantity</span>
              <span class="font-mono text-slate-200 tabular-nums">${tx.qty}</span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-400">Customer Type</span>
              <span class="text-slate-200 font-medium">${tx.customerType}</span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-400">Recorded By</span>
              <span class="text-slate-200 italic">by ${tx.staff}</span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-400">Timestamp</span>
              <span class="font-mono text-slate-300 tabular-nums">${tx.timestamp}</span>
            </div>
          </div>

          <div class="pt-3 border-t border-white/[0.08] flex items-center justify-between">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Amount</span>
            <span class="font-mono text-xl font-bold text-violet-300 tabular-nums">${formatMMK(tx.amount)}</span>
          </div>
        </div>

        <!-- Notes -->
        <div class="rounded-2xl bg-white/[0.02] border border-white/[0.07] p-4">
          <span class="text-[11px] font-medium uppercase tracking-wider text-slate-400">Order Notes</span>
          <p class="text-xs text-slate-300 mt-1 leading-relaxed">${tx.notes}</p>
        </div>
      `;

      document.getElementById('receiptDrawerFooter').innerHTML = `
        <button type="button" onclick="copyInvoiceId(event, '${tx.id}')" class="px-4 py-2.5 rounded-xl text-xs font-medium text-slate-200 bg-white/[0.05] hover:bg-white/[0.1] border border-white/10 transition">
          Copy Invoice ID
        </button>
        <button type="button" onclick="closeReceiptDrawer(); showToast('Receipt formatted for thermal printer', 'success')" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-white active-tab-pill transition">
          Print Receipt
        </button>
      `;

      receiptBackdrop.classList.remove('hidden');
      requestAnimationFrame(() => {
        receiptBackdrop.classList.remove('opacity-0');
        receiptDrawer.classList.remove('translate-x-full');
        receiptDrawer.setAttribute('aria-hidden', 'false');
      });
    }

    function toggleTransactionStatus(invoiceId) {
      const tx = transactions.find(t => t.id === invoiceId);
      if (!tx) return;
      tx.status = tx.status === 'sold' ? 'order' : 'sold';
      renderTransactions();
      openReceiptDrawer(invoiceId);
      showToast(`${tx.id} updated to ${tx.status === 'sold' ? 'Already Sale' : 'Order'}`, 'success');
    }

    function closeReceiptDrawer() {
      receiptBackdrop.classList.add('opacity-0');
      receiptDrawer.classList.add('translate-x-full');
      receiptDrawer.setAttribute('aria-hidden', 'true');
      setTimeout(() => {
        receiptBackdrop.classList.add('hidden');
      }, 300);
    }

    // --- Export CSV Action ---
    function exportCSV() {
      const headers = ['Invoice ID', 'Item', 'Customer Type', 'Staff', 'Quantity', 'Timestamp', 'Amount (MMK)', 'Status'];
      const rows = transactions.map(t => [
        t.id,
        `"${t.item.replace(/"/g, '""')}"`,
        t.customerType,
        `"${t.staff}"`,
        t.qty,
        `"${t.timestamp}"`,
        t.amount,
        t.status === 'sold' ? 'Already Sale' : 'Order'
      ]);
      const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', 'sales_orders_history.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast(`Exported ${transactions.length} records to CSV`, 'success');
    }

    // --- Non-Blocking Toast Feedback & Undo Toast ---
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const dotColor = type === 'success' ? 'bg-emerald-400' : 'bg-violet-400';

      toast.className = 'pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl bg-obsidian-850/95 backdrop-blur-xl border border-white/15 shadow-2xl text-xs font-medium text-slate-100 transform translate-y-2 opacity-0 transition-all duration-300';
      toast.innerHTML = `
        <span class="w-2 h-2 rounded-full ${dotColor} shrink-0"></span>
        <span>${message}</span>
      `;
      container.appendChild(toast);

      requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function showUndoToast(message) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');

      toast.className = 'pointer-events-auto flex items-center justify-between gap-4 px-4 py-3 rounded-xl bg-obsidian-850/95 backdrop-blur-xl border border-rose-500/30 shadow-2xl text-xs font-medium text-slate-100 transform translate-y-2 opacity-0 transition-all duration-300';
      toast.innerHTML = `
        <div class="flex items-center gap-2.5">
          <span class="w-2 h-2 rounded-full bg-rose-400 shrink-0"></span>
          <span>${message}</span>
        </div>
        <button type="button" class="px-2.5 py-1 rounded-lg bg-violet-500/20 hover:bg-violet-500/35 border border-violet-400/30 text-violet-200 font-semibold transition">
          Undo
        </button>
      `;

      toast.querySelector('button').addEventListener('click', () => {
        undoLastDelete();
        toast.remove();
      });

      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));

      setTimeout(() => {
        if (toast.parentElement) {
          toast.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => toast.remove(), 300);
        }
      }, 4500);
    }

    // Initial Render
    renderTransactions();
  </script>
</body>
</html>
