# Links this repo checkout to the Netlify project so CLI deploys resolve it
site_id = "a3f525d0-a5ea-4e41-90d7-ab534cf254db"

# The base directory must be the repo root. build/ is gitignored, so
# build/web never exists in a fresh clone, and Netlify validates the base
# directory BEFORE running the build command -> "Base directory does not
# exist" and the build dies at the config-parsing stage.
# Setting base here overrides the "build/web" value stored in the site's UI
# settings, so the repo is self-contained.
[build]
  base = "/"
  command = "bash build.sh"
  publish = "build/web"

# Headers for the Flutter web build output (publish dir: build/web)

# Keep index.html fresh so users always get the latest app shell
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Flutter assets are fingerprinted, cache them aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker must never be cached
[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache"
